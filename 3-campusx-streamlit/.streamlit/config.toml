# Project-local Streamlit configuration.
# Replaces the bundled setup.sh, which would have written to
# ~/.streamlit/config.toml - i.e. outside this project directory.

[server]
port = 8503
address = "localhost"      # local only, not 0.0.0.0
headless = true            # do not open a browser automatically
# enableCORS is intentionally left at its default (true): setting it to false
# while enableXsrfProtection is true makes Streamlit override it anyway and
# print a warning on every start.
enableXsrfProtection = true
fileWatcherType = "none"   # no restart on file changes

[browser]
gatherUsageStats = false   # no telemetry leaving the machine
serverAddress = "localhost"
serverPort = 8503

[global]
developmentMode = false
