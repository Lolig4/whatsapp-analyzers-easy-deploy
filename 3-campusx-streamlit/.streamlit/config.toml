# Projekt-lokale Streamlit-Konfiguration.
# Ersetzt das mitgelieferte setup.sh, das nach ~/.streamlit/config.toml
# geschrieben haette - also ausserhalb dieses Projektordners.

[server]
port = 8503
address = "localhost"      # nur lokal erreichbar, kein 0.0.0.0
headless = true            # kein automatisches Oeffnen des Browsers
enableCORS = false
enableXsrfProtection = true
fileWatcherType = "none"   # kein Neustart bei Dateiaenderung

[browser]
gatherUsageStats = false   # keine Telemetrie nach aussen
serverAddress = "localhost"
serverPort = 8503

[global]
developmentMode = false
